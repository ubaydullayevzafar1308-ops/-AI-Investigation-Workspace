services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: case_intelligence
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_secret
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:app_secret@db:5432/case_intelligence?sslmode=disable
      PORT: "8080"
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CACHE_ENABLED: "true"
    depends_on: [db]
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  pgdata:
