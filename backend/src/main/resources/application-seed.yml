seed:
  client-count: 5000
  company-count: 500
  background-transaction-count: 100000
  random-seed: 42

# В seed-профиле Flyway всё равно должен отработать как обычно (миграции
# уже накатаны или накатятся сейчас) — секция ниже НЕ отключает Flyway,
# просто явно подтверждает, что seed-профиль не меняет поведение схемы.
spring:
  flyway:
    enabled: true
