spring:
  application:
    name: case-intelligence-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/case_intelligence}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app_secret}

  jpa:
    hibernate:
      # Схему целиком ведёт Flyway; Hibernate только валидирует соответствие
      # entity <-> таблицы. Никогда не ставить update/create здесь.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    uz.caseintel: INFO

# Заготовка под этап 5 (AI Layer) — пока не используется ни одним бином.
llm:
  provider: ${LLM_PROVIDER:claude}
  model: ${LLM_MODEL:claude-sonnet-4-6}
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  cache-enabled: ${LLM_CACHE_ENABLED:true}
  timeout-seconds: 60
